name: Deploy to EC2

on:
  push:
    branches: [main]

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SLACK_USER_OAUTH_ENABLED: ${{ vars.SLACK_USER_OAUTH_ENABLED || 'false' }}
          DEPLOY_SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          DEPLOY_SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          DEPLOY_SLACK_OAUTH_REDIRECT_URI: ${{ vars.SLACK_OAUTH_REDIRECT_URI }}
          DEPLOY_SLACK_TOKEN_ENCRYPTION_KEY: ${{ secrets.SLACK_TOKEN_ENCRYPTION_KEY }}
          DEPLOY_SLACK_TOKEN_ROTATION_ENABLED: ${{ vars.SLACK_TOKEN_ROTATION_ENABLED || 'false' }}
          DEPLOY_SLACK_USER_OAUTH_PORT: ${{ vars.SLACK_USER_OAUTH_PORT || '3000' }}
          DEPLOY_SLACK_OAUTH_STATE_TTL_SECONDS: ${{ vars.SLACK_OAUTH_STATE_TTL_SECONDS || '600' }}
          DEPLOY_SLACK_MENTION_GROUP_REPLACEMENT_ENABLED: ${{ vars.SLACK_MENTION_GROUP_REPLACEMENT_ENABLED || 'false' }}
          DEPLOY_SLACK_MENTION_GROUP_COMMAND_ENABLED: ${{ vars.SLACK_MENTION_GROUP_COMMAND_ENABLED || 'false' }}
          DEPLOY_RADAR_MENTION_GROUPS_API_URL: ${{ vars.RADAR_MENTION_GROUPS_API_URL }}
          DEPLOY_SHOOKIE_MENTION_GROUPS_API_KEY: ${{ secrets.SHOOKIE_MENTION_GROUPS_API_KEY }}
          DEPLOY_RADAR_MENTION_GROUPS_WRITE_API_URL: ${{ vars.RADAR_MENTION_GROUPS_WRITE_API_URL }}
          DEPLOY_SHOOKIE_MENTION_GROUPS_WRITE_API_KEY: ${{ secrets.SHOOKIE_MENTION_GROUPS_WRITE_API_KEY }}
          DEPLOY_RADAR_MENTION_GROUPS_CACHE_TTL_SECONDS: ${{ vars.RADAR_MENTION_GROUPS_CACHE_TTL_SECONDS || '30' }}
          DEPLOY_RADAR_MENTION_GROUPS_REQUEST_TIMEOUT_MS: ${{ vars.RADAR_MENTION_GROUPS_REQUEST_TIMEOUT_MS || '10000' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_SLACK_USER_OAUTH_ENABLED,DEPLOY_SLACK_CLIENT_ID,DEPLOY_SLACK_CLIENT_SECRET,DEPLOY_SLACK_OAUTH_REDIRECT_URI,DEPLOY_SLACK_TOKEN_ENCRYPTION_KEY,DEPLOY_SLACK_TOKEN_ROTATION_ENABLED,DEPLOY_SLACK_USER_OAUTH_PORT,DEPLOY_SLACK_OAUTH_STATE_TTL_SECONDS,DEPLOY_SLACK_MENTION_GROUP_REPLACEMENT_ENABLED,DEPLOY_SLACK_MENTION_GROUP_COMMAND_ENABLED,DEPLOY_RADAR_MENTION_GROUPS_API_URL,DEPLOY_SHOOKIE_MENTION_GROUPS_API_KEY,DEPLOY_RADAR_MENTION_GROUPS_WRITE_API_URL,DEPLOY_SHOOKIE_MENTION_GROUPS_WRITE_API_KEY,DEPLOY_RADAR_MENTION_GROUPS_CACHE_TTL_SECONDS,DEPLOY_RADAR_MENTION_GROUPS_REQUEST_TIMEOUT_MS
          script: |
            set -e
            # 이전 GITHUB_TOKEN 기반 url 설정 초기화 (토큰 만료/누적 방지)
            git config --global --get-regexp '^url\.' 2>/dev/null | awk '{print $1}' | while read key; do git config --global --unset-all "$key" 2>/dev/null || true; done
            # 새 토큰으로 설정
            git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
            cd /home/ubuntu/shookie
            git fetch origin
            git reset --hard origin/main

            # PostgreSQL은 별도 Compose 생명주기로 관리한다. 일반 배포에서는
            # 기존 컨테이너가 healthy인지 확인만 하고 생성/교체/중단하지 않는다.
            DB_CONTAINER_ID_BEFORE="$(docker compose -f docker-compose.db.yml ps -q db)"
            if [ -z "$DB_CONTAINER_ID_BEFORE" ]; then
              echo "Shared PostgreSQL container is not running; aborting application deploy."
              exit 1
            fi
            DB_STARTED_AT_BEFORE="$(docker inspect --format '{{.State.StartedAt}}' "$DB_CONTAINER_ID_BEFORE")"
            if [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$DB_CONTAINER_ID_BEFORE")" != "healthy" ]; then
              echo "Shared PostgreSQL container is not healthy; aborting application deploy."
              exit 1
            fi
            docker compose -f docker-compose.db.yml exec -T db pg_isready -U postgres -d shookie

            docker builder prune -af
            docker image prune -f
            docker compose build bot
            SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }} \
            SLACK_APP_TOKEN=${{ secrets.SLACK_APP_TOKEN }} \
            LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
            LLM_BASE_URL=https://api.deepseek.com \
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} \
            GITHUB=${{ secrets.GITHUB }} \
            SLACK_USER_OAUTH_ENABLED="$DEPLOY_SLACK_USER_OAUTH_ENABLED" \
            SLACK_CLIENT_ID="$DEPLOY_SLACK_CLIENT_ID" \
            SLACK_CLIENT_SECRET="$DEPLOY_SLACK_CLIENT_SECRET" \
            SLACK_OAUTH_REDIRECT_URI="$DEPLOY_SLACK_OAUTH_REDIRECT_URI" \
            SLACK_TOKEN_ENCRYPTION_KEY="$DEPLOY_SLACK_TOKEN_ENCRYPTION_KEY" \
            SLACK_TOKEN_ROTATION_ENABLED="$DEPLOY_SLACK_TOKEN_ROTATION_ENABLED" \
            SLACK_USER_OAUTH_PORT="$DEPLOY_SLACK_USER_OAUTH_PORT" \
            SLACK_OAUTH_STATE_TTL_SECONDS="$DEPLOY_SLACK_OAUTH_STATE_TTL_SECONDS" \
            SLACK_MENTION_GROUP_REPLACEMENT_ENABLED="$DEPLOY_SLACK_MENTION_GROUP_REPLACEMENT_ENABLED" \
            SLACK_MENTION_GROUP_COMMAND_ENABLED="$DEPLOY_SLACK_MENTION_GROUP_COMMAND_ENABLED" \
            RADAR_MENTION_GROUPS_API_URL="$DEPLOY_RADAR_MENTION_GROUPS_API_URL" \
            SHOOKIE_MENTION_GROUPS_API_KEY="$DEPLOY_SHOOKIE_MENTION_GROUPS_API_KEY" \
            RADAR_MENTION_GROUPS_WRITE_API_URL="$DEPLOY_RADAR_MENTION_GROUPS_WRITE_API_URL" \
            SHOOKIE_MENTION_GROUPS_WRITE_API_KEY="$DEPLOY_SHOOKIE_MENTION_GROUPS_WRITE_API_KEY" \
            RADAR_MENTION_GROUPS_CACHE_TTL_SECONDS="$DEPLOY_RADAR_MENTION_GROUPS_CACHE_TTL_SECONDS" \
            RADAR_MENTION_GROUPS_REQUEST_TIMEOUT_MS="$DEPLOY_RADAR_MENTION_GROUPS_REQUEST_TIMEOUT_MS" \
            THREAD_WORKSPACE_BASE_PATH=/tmp/shookie-workspaces \
            THREAD_WORKSPACE_MAX_GB=5 \
            LOG_LEVEL=debug \
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            docker compose up -d --no-deps bot

            BOT_CONTAINER_ID="$(docker compose ps -q bot)"
            if [ -z "$BOT_CONTAINER_ID" ] || [ "$(docker inspect --format '{{.State.Running}}' "$BOT_CONTAINER_ID")" != "true" ]; then
              echo "Shookie bot container is not running after deploy."
              exit 1
            fi

            DB_CONTAINER_ID_AFTER="$(docker compose -f docker-compose.db.yml ps -q db)"
            DB_STARTED_AT_AFTER="$(docker inspect --format '{{.State.StartedAt}}' "$DB_CONTAINER_ID_AFTER")"
            if [ "$DB_CONTAINER_ID_BEFORE" != "$DB_CONTAINER_ID_AFTER" ] || [ "$DB_STARTED_AT_BEFORE" != "$DB_STARTED_AT_AFTER" ]; then
              echo "Shared PostgreSQL identity or start time changed during application deploy."
              exit 1
            fi
            docker compose -f docker-compose.db.yml exec -T db pg_isready -U postgres -d shookie
