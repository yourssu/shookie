# Merge these entries into the existing Shookie Slack app manifest.
# Do not replace the app's current scopes or bot event subscriptions.
oauth_config:
  scopes:
    bot:
      - reactions:read
      # Optional display names for thread/read/search authors (bot credential only).
      # Apply manually and reinstall the existing app; missing scope is nonfatal.
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - reaction_added
      - reaction_removed
