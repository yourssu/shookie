x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

name: shookie

services:
  bot:
    image: shookie-bot:local
    build:
      context: .
      dockerfile: shookie/Dockerfile
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:${SLACK_USER_OAUTH_PORT:-3000}:${SLACK_USER_OAUTH_PORT:-3000}"
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      SLACK_USER_OAUTH_ENABLED: ${SLACK_USER_OAUTH_ENABLED:-false}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: ${SLACK_OAUTH_REDIRECT_URI:-}
      SLACK_TOKEN_ENCRYPTION_KEY: ${SLACK_TOKEN_ENCRYPTION_KEY:-}
      SLACK_TOKEN_ROTATION_ENABLED: ${SLACK_TOKEN_ROTATION_ENABLED:-false}
      SLACK_USER_OAUTH_PORT: ${SLACK_USER_OAUTH_PORT:-3000}
      SLACK_OAUTH_STATE_TTL_SECONDS: ${SLACK_OAUTH_STATE_TTL_SECONDS:-600}
      SLACK_MENTION_GROUP_REPLACEMENT_ENABLED: ${SLACK_MENTION_GROUP_REPLACEMENT_ENABLED:-false}
      SLACK_MENTION_GROUP_COMMAND_ENABLED: ${SLACK_MENTION_GROUP_COMMAND_ENABLED:-false}
      RADAR_MENTION_GROUPS_API_URL: ${RADAR_MENTION_GROUPS_API_URL:-}
      SHOOKIE_MENTION_GROUPS_API_KEY: ${SHOOKIE_MENTION_GROUPS_API_KEY:-}
      RADAR_MENTION_GROUPS_WRITE_API_URL: ${RADAR_MENTION_GROUPS_WRITE_API_URL:-}
      SHOOKIE_MENTION_GROUPS_WRITE_API_KEY: ${SHOOKIE_MENTION_GROUPS_WRITE_API_KEY:-}
      SLACK_EVENT_ATTENDANCE_ENABLED: ${SLACK_EVENT_ATTENDANCE_ENABLED:-false}
      SLACK_EVENT_ATTENDING_EMOJI: ${SLACK_EVENT_ATTENDING_EMOJI:-shookie_attend}
      SLACK_EVENT_ABSENT_EMOJI: ${SLACK_EVENT_ABSENT_EMOJI:-shookie_absent}
      SLACK_EVENT_AFTERPARTY_EMOJI: ${SLACK_EVENT_AFTERPARTY_EMOJI:-shookie_afterparty}
      RADAR_EVENT_ATTENDANCE_WRITE_API_URL: ${RADAR_EVENT_ATTENDANCE_WRITE_API_URL:-}
      SHOOKIE_EVENT_ATTENDANCE_WRITE_API_KEY: ${SHOOKIE_EVENT_ATTENDANCE_WRITE_API_KEY:-}
      RADAR_EVENT_ATTENDANCE_REQUEST_TIMEOUT_MS: ${RADAR_EVENT_ATTENDANCE_REQUEST_TIMEOUT_MS:-10000}
      RADAR_MEETING_REMINDER_API_URL: ${RADAR_MEETING_REMINDER_API_URL:-}
      SHOOKIE_MEETING_REMINDER_INTERNAL_API_KEY: ${SHOOKIE_MEETING_REMINDER_INTERNAL_API_KEY:-}
      RADAR_MENTION_GROUPS_CACHE_TTL_SECONDS: ${RADAR_MENTION_GROUPS_CACHE_TTL_SECONDS:-30}
      RADAR_MENTION_GROUPS_REQUEST_TIMEOUT_MS: ${RADAR_MENTION_GROUPS_REQUEST_TIMEOUT_MS:-10000}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      GITHUB: ${GITHUB:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shookie

networks:
  default:
    name: shookie_default
    external: true
