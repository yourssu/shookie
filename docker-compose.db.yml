x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

name: shookie

services:
  db:
    image: postgres:16
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: shookie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./database/migrations/002_add_sessions_and_invocations.sql:/docker-entrypoint-initdb.d/002_add_sessions_and_invocations.sql
      - ./database/migrations/003_backfill_session_titles.sql:/docker-entrypoint-initdb.d/003_backfill_session_titles.sql
      - ./database/migrations/004_add_slack_user_oauth.sql:/docker-entrypoint-initdb.d/004_add_slack_user_oauth.sql
      - ./database/migrations/005_harden_slack_user_oauth.sql:/docker-entrypoint-initdb.d/005_harden_slack_user_oauth.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: shookie_default

volumes:
  pgdata:
    name: shookie_pgdata
